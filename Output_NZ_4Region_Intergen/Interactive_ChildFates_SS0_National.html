<script>
const DATA = JSON.parse(document.getElementById("sankey-data").textContent);
const svgEl = document.getElementById("sankey-svg");
const stageEl = document.getElementById("stage-wrap");
const hoverBox = document.getElementById("hover-box");
const leaderLine = document.getElementById("leader-line");
const anchorDot = document.getElementById("anchor-dot");
let activeIdx = 0; let anchorBlk = 1; let anchorSide = "src";

function rgbCss(arr, alpha) {
  if (alpha !== undefined) return `rgba(${arr[0]},${arr[1]},${arr[2]},${alpha})`;
  return `rgb(${arr[0]},${arr[1]},${arr[2]})`;
}

function clearSelection() {
  activeIdx = 0;
  document.querySelectorAll(".sankey-ribbon").forEach(el => el.setAttribute("fill-opacity", "0.45"));
  document.querySelectorAll(".node-label").forEach(el => {
    el.setAttribute("font-weight", el.getAttribute("data-orig-weight") || "400");
    el.setAttribute("fill", el.getAttribute("data-orig-color") || "#111");
  });
  hoverBox.style.display = "none";
  leaderLine.setAttribute("visibility", "hidden");
  anchorDot.setAttribute("visibility", "hidden");
}

function selectRibbon(hitIdx, refSvgX) {
  const rib = DATA.ribbons[hitIdx - 1];
  if (!rib) return;
  activeIdx = hitIdx;

  // 1. Spotlight active ribbon & dim background ribbons
  document.querySelectorAll(".sankey-ribbon").forEach(el => {
    const idx = parseInt(el.getAttribute("data-idx"), 10);
    el.setAttribute("fill-opacity", idx === hitIdx ? "0.92" : "0.12");
  });

  // 2. Bold Source & Target labels, softly fade unselected labels
  document.querySelectorAll(".node-label").forEach(el => {
    const idNum = parseInt(el.id.replace("lbl_", ""), 10);
    if (idNum === rib.srcLbl || idNum === rib.tgtLbl) {
      el.setAttribute("font-weight", "700");
      el.setAttribute("fill", "#080808");
    } else {
      el.setAttribute("font-weight", el.getAttribute("data-orig-weight") || "400");
      el.setAttribute("fill", "#6e7785");
    }
  });

  // 3. Find slice sIdx along rib.svgX
  const xg = rib.svgX; const N = xg.length;
  let sIdx = 0; let bestD = 1e9;
  for (let i = 0; i < N; i++) {
    const d = Math.abs(xg[i] - refSvgX);
    if (d < bestD) { bestD = d; sIdx = i; }
  }
  const iMin = Math.max(1, Math.round(0.16 * N));
  const iMax = Math.min(N - 2, Math.round(0.84 * N));
  sIdx = Math.min(Math.max(sIdx, iMin), iMax);

  const xPin = xg[sIdx];
  const yPin = rib.svgYMid[sIdx];
  const wFrac = sIdx / Math.max(1, N - 1);
  const cLoc = [
    Math.round((1 - wFrac) * rib.cS[0] + wFrac * rib.cT[0]),
    Math.round((1 - wFrac) * rib.cS[1] + wFrac * rib.cT[1]),
    Math.round((1 - wFrac) * rib.cS[2] + wFrac * rib.cT[2])
  ];
  const cBorder = cLoc.map(v => Math.round(0.76 * v));
  const cBg = cLoc.map(v => Math.round(0.91 * 255 + 0.09 * v));

  // 4. Populate HTML narrative box & measure its exact size in SVG units
  hoverBox.innerHTML = rib.html;
  hoverBox.style.borderColor = rgbCss(cBorder);
  hoverBox.style.backgroundColor = rgbCss(cBg);
  hoverBox.style.display = "block";

  const scaleX = DATA.svgW / stageEl.clientWidth;
  const scaleY = DATA.svgH / stageEl.clientHeight;
  const boxW = hoverBox.offsetWidth * scaleX;
  const boxH = hoverBox.offsetHeight * scaleY;

  const pos = computeOptimalBoxPosition(rib, xPin, yPin, boxW, boxH);
  hoverBox.style.left = `${(pos.boxX / DATA.svgW) * 100}%`;
  hoverBox.style.top  = `${(pos.boxY / DATA.svgH) * 100}%`;

  leaderLine.setAttribute("x1", xPin);
  leaderLine.setAttribute("y1", yPin);
  leaderLine.setAttribute("x2", pos.attachX);
  leaderLine.setAttribute("y2", pos.attachY);
  leaderLine.setAttribute("stroke", rgbCss(cBorder));
  leaderLine.setAttribute("visibility", "visible");

  anchorDot.setAttribute("cx", xPin);
  anchorDot.setAttribute("cy", yPin);
  anchorDot.setAttribute("stroke", rgbCss(cBorder));
  anchorDot.setAttribute("visibility", "visible");
}

function computeOptimalBoxPosition(rib, xPin, yPin, boxW, boxH) {
  const minX = 35; const maxX = DATA.svgW - 25;
  const minY = DATA.minYSvg; const maxY = DATA.maxYSvg;
  const xg = rib.svgX; const xL = xg[0]; const xR = xg[xg.length - 1];
  let candX = [];
  if (!DATA.isFates17) {
    // 6-Gate Fiscal Sankey: opposite hemisphere from Gate-4 wiggly line
    if (rib.xMidAx >= 4.0) {
      const maxRight = DATA.xSplitSvg - 60 - boxW;
      candX = [maxRight, maxRight - 90, DATA.gateXSvg[1] + 25, DATA.gateXSvg[0] + 25];
    } else {
      const minLeft = DATA.xSplitSvg + 65;
      candX = [minLeft, minLeft + 70, DATA.gateXSvg[4] + 25, maxX - boxW];
    }
  } else {
    // 5-Gate Fates Sankey: Node 2 & Node 16 open bays
    if (rib.xMidAx < 3.9) {
      candX = [DATA.gateXSvg[3] + 55, DATA.gateXSvg[4] - boxW - 20, DATA.gateXSvg[4] + 22, DATA.gateXSvg[0] + 25, DATA.gateXSvg[1] + 25];
    } else {
      candX = [DATA.gateXSvg[4] + 22, maxX - boxW, DATA.gateXSvg[4] - boxW - 20, DATA.gateXSvg[3] + 55, DATA.gateXSvg[1] + 25, DATA.gateXSvg[0] + 25];
    }
  }
  candX = candX.map(v => Math.min(Math.max(v, minX), maxX - boxW));

  const candY = [yPin - 0.5 * boxH];
  for (let s = 0; s <= 40; s++) {
    candY.push(minY + (s / 40) * Math.max(1, (maxY - boxH) - minY));
  }

  let bestScore = 1e12; let bestX = candX[0]; let bestY = candY[0];
  const padX = 18; const padY = 12;
  for (const cx of candX) {
    for (let cy of candY) {
      cy = Math.min(Math.max(cy, minY), maxY - boxH);
      let ribPen = 0;
      for (let i = 0; i < xg.length; i++) {
        if (xg[i] >= cx && xg[i] <= cx + boxW) {
          const rTop = rib.svgYTop[i] - 8; const rBot = rib.svgYBot[i] + 8;
          const ov = Math.max(0, Math.min(cy + boxH, rBot) - Math.max(cy, rTop));
          if (ov > 0) ribPen += 1500 + 180 * ov;
        }
      }
      let lblPen = 0;
      for (const lb of DATA.lblBBoxes) {
        const ox = Math.max(0, Math.min(cx + boxW, lb[1] + padX) - Math.max(cx, lb[0] - padX));
        const oy = Math.max(0, Math.min(cy + boxH, lb[3] + padY) - Math.max(cy, lb[2] - padY));
        if (ox > 0 && oy > 0) lblPen += 900 + 0.65 * (ox * oy);
      }
      let barPen = 0;
      for (let g = 1; g <= 3; g++) {
        const gx = DATA.gateXSvg[g];
        if (cx < gx + 14 && cx + boxW > gx - 14) barPen += 260;
      }
      const distPen = 0.045 * Math.abs((cy + 0.5 * boxH) - yPin) + 0.015 * Math.abs((cx + 0.5 * boxW) - xPin);
      const score = ribPen + lblPen + barPen + distPen;
      if (score < bestScore) { bestScore = score; bestX = cx; bestY = cy; }
    }
  }
  const attachX = Math.min(Math.max(xPin, bestX), bestX + boxW);
  const attachY = Math.min(Math.max(yPin, bestY), bestY + boxH);
  return { boxX: bestX, boxY: bestY, attachX, attachY };
}

// Click Handling on Ribbons, Blocks, and Background
svgEl.addEventListener("click", (evt) => {
  const pt = svgEl.createSVGPoint();
  pt.x = evt.clientX; pt.y = evt.clientY;
  const svgP = pt.matrixTransform(svgEl.getScreenCTM().inverse());
  const tgt = evt.target;
  if (tgt.classList.contains("sankey-ribbon")) {
    const hitIdx = parseInt(tgt.getAttribute("data-idx"), 10);
    const rib = DATA.ribbons[hitIdx - 1];
    const xg = rib.svgX;
    const fracX = (svgP.x - xg[0]) / Math.max(1, xg[xg.length - 1] - xg[0]);
    let pinX = svgP.x;
    if (fracX <= 0.65) {
      anchorSide = "src"; anchorBlk = rib.srcBlk;
      pinX = Math.min(svgP.x, xg[0] + 0.38 * (xg[xg.length - 1] - xg[0]));
    } else {
      anchorSide = "tgt"; anchorBlk = rib.tgtBlk;
      pinX = Math.max(svgP.x, xg[0] + 0.68 * (xg[xg.length - 1] - xg[0]));
    }
    selectRibbon(hitIdx, pinX);
  } else if (tgt.classList.contains("sankey-block")) {
    const b = parseInt(tgt.getAttribute("data-blk"), 10);
    const outR = DATA.ribbons.filter(r => r && r.srcBlk === b);
    const inR  = DATA.ribbons.filter(r => r && r.tgtBlk === b);
    if (outR.length > 0) {
      anchorBlk = b; anchorSide = "src";
      const chosen = outR[0]; const xg = chosen.svgX;
      selectRibbon(chosen.idx, xg[Math.round(0.28 * (xg.length - 1))]);
    } else if (inR.length > 0) {
      anchorBlk = b; anchorSide = "tgt";
      const chosen = inR[0]; const xg = chosen.svgX;
      selectRibbon(chosen.idx, xg[Math.round(0.72 * (xg.length - 1))]);
    }
  } else {
    clearSelection();
  }
});

// Keyboard Arrow-Key Navigation (Strict 2-Level Gate -> Block Hierarchy)
window.addEventListener("keydown", (evt) => {
  if (evt.key === "Escape") { clearSelection(); return; }
  if (activeIdx === 0) return;
  if (evt.key === "ArrowUp" || evt.key === "ArrowDown") {
    evt.preventDefault();
    const currGate = DATA.blkGateCol[anchorBlk - 1];
    const gateBlks = [];
    for (let b = 1; b <= DATA.blkGateCol.length; b++) {
      if (DATA.blkGateCol[b - 1] === currGate) gateBlks.push(b);
    }
    gateBlks.sort((a, b) => DATA.blkYMid[a - 1] - DATA.blkYMid[b - 1]);
    const hierLinks = [];
    for (const b of gateBlks) {
      let bLinks = DATA.ribbons.filter(r => r && (anchorSide === "src" ? r.srcBlk === b : r.tgtBlk === b));
      bLinks.sort((r1, r2) => {
        const p1 = anchorSide === "src" ? r1.tgtBlk : r1.srcBlk;
        const p2 = anchorSide === "src" ? r2.tgtBlk : r2.srcBlk;
        return DATA.blkYMid[p1 - 1] - DATA.blkYMid[p2 - 1];
      });
      bLinks.forEach(r => hierLinks.push(r.idx));
    }
    if (hierLinks.length <= 1) return;
    let pos = hierLinks.indexOf(activeIdx);
    if (pos < 0) pos = 0;
    pos = (evt.key === "ArrowUp") ? (pos + 1) % hierLinks.length : (pos - 1 + hierLinks.length) % hierLinks.length;
    const nextIdx = hierLinks[pos];
    const nextRib = DATA.ribbons[nextIdx - 1];
    anchorBlk = (anchorSide === "src") ? nextRib.srcBlk : nextRib.tgtBlk;
    const xg = nextRib.svgX;
    const refX = xg[Math.round((anchorSide === "src" ? 0.28 : 0.72) * (xg.length - 1))];
    selectRibbon(nextIdx, refX);
  } else if (evt.key === "ArrowLeft") {
    evt.preventDefault();
    const rib = DATA.ribbons[activeIdx - 1];
    anchorSide = "src"; anchorBlk = rib.srcBlk;
    selectRibbon(activeIdx, rib.svgX[Math.round(0.28 * (rib.svgX.length - 1))]);
  } else if (evt.key === "ArrowRight") {
    evt.preventDefault();
    const rib = DATA.ribbons[activeIdx - 1];
    anchorSide = "tgt"; anchorBlk = rib.tgtBlk;
    selectRibbon(activeIdx, rib.svgX[Math.round(0.72 * (rib.svgX.length - 1))]);
  }
});
</script>
